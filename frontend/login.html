<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar | Estúdio</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">E</span><span>ESTÚDIO / TATUAGEM</span></a><nav class="site-nav"><a href="index.html">Início</a></nav></header>
  <main class="auth-layout">
    <aside class="auth-aside"><img src="../aulas/desenhostatuagens/gatinho2.webp" alt="Ilustração para tatuagem"><p class="eyebrow">Área da equipe</p><h1>Bom trabalho começa com espaço para criar.</h1><p>Entre para acessar agenda, clientes e o dia a dia do estúdio.</p></aside>
    <section class="auth-main"><div class="auth-card"><p class="eyebrow">Acesso seguro</p><h2>Entrar</h2><p>Use seu e-mail e senha da equipe.</p><div id="mensagem" class="alert" role="alert"></div><form id="form-login" class="auth-form">
      <div class="field full"><label for="email">E-mail</label><input id="email" type="email" autocomplete="username" required></div>
      <div class="field full"><label for="senha">Senha</label><input id="senha" type="password" autocomplete="current-password" required></div>
      <button class="button primary" type="submit">Entrar no painel</button>
    </form><p class="auth-foot"><a href="index.html">Voltar à página inicial</a></p></div></section>
  </main>
  <script src="js/auth.js"></script><script src="js/app.js"></script><script src="js/login.js"></script>
</body>
</html>
