<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agendamentos | Estúdio</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="nav-root"></div>
  <main class="page-shell">
    <div class="page-heading"><div><p class="eyebrow">Atendimento</p><h1>Agendamentos</h1><p>Planeje sessões e acompanhe cada etapa do atendimento.</p></div></div>
    <div id="mensagem" class="alert notice" role="alert"></div>
    <section class="panel form-panel"><form id="form-agendamento" class="form-grid">
      <div class="field"><label for="idcliente">Cliente</label><select id="idcliente" required><option value="">Selecione...</option></select></div>
      <div class="field"><label for="idtatuador">Tatuador</label><select id="idtatuador" required><option value="">Selecione...</option></select></div>
      <div class="field"><label for="dataagendamento">Data</label><input id="dataagendamento" type="date" required></div>
      <div class="field"><label for="horaagendamento">Horário</label><input id="horaagendamento" type="time" required></div>
      <div class="field"><label for="valortatuagem">Valor (R$)</label><input id="valortatuagem" type="number" step="0.01" min="0" placeholder="0,00"></div>
      <div class="field full"><label for="descricaotatuagem">Descrição da tatuagem</label><textarea id="descricaotatuagem" maxlength="2000" placeholder="Área, dimensões, referências..."></textarea></div>
      <div class="field wide"><label for="desenho">Desenho aprovado</label><input id="desenho" type="file" accept="image/jpeg,image/png,image/gif,image/webp"><p class="field-help">JPEG, PNG, GIF ou WebP. Até 5 MB.</p></div>
      <div class="field" id="bloco-status" hidden><label for="status">Status</label><select id="status"><option value="pendente">Pendente</option><option value="confirmado">Confirmado</option><option value="concluido">Concluído</option><option value="cancelado">Cancelado</option></select></div>
      <div class="form-actions"><button id="btn-submit" class="button primary" type="submit">Agendar sessão</button><button id="btn-cancelar" class="button secondary" type="button" hidden>Cancelar</button></div>
    </form></section>
    <section class="panel"><div class="table-wrap"><table><thead><tr><th>ID</th><th>Cliente</th><th>Tatuador</th><th>Data</th><th>Hora</th><th>Valor</th><th>Status</th><th>Desenho</th><th>Ações</th></tr></thead><tbody id="corpo-tabela"><tr><td colspan="9" class="empty-state">Carregando agenda...</td></tr></tbody></table></div></section>
  </main>
  <script src="js/auth.js"></script><script src="js/app.js"></script><script src="js/agendamentos.js"></script>
</body>
</html>
