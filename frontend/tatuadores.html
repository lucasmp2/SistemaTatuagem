<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tatuadores | Estúdio</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="nav-root"></div>
  <main class="page-shell">
    <div class="page-heading"><div><p class="eyebrow">Equipe</p><h1>Tatuadores</h1><p>Perfis, experiência e especialidades do estúdio.</p></div></div>
    <div id="mensagem" class="alert notice" role="alert"></div>
    <section class="panel form-panel"><form id="form-tatuador" class="form-grid">
      <div class="field wide"><label for="nometatuador">Nome</label><input id="nometatuador" maxlength="100" required></div>
      <div class="field"><label for="cpf">CPF</label><input id="cpf" inputmode="numeric" pattern="[0-9]{11}" maxlength="11" placeholder="11 números" required></div>
      <div class="field"><label for="email">E-mail</label><input id="email" type="email" maxlength="100"></div>
      <div class="field"><label for="telefone">Telefone</label><input id="telefone" maxlength="20"></div>
      <div class="field"><label for="idsenioridade">Senioridade</label><select id="idsenioridade" required><option value="">Selecione...</option></select></div>
      <div class="field full"><label>Estilos que domina</label><div id="lista-estilos" class="check-list"><span class="loading">Carregando estilos...</span></div></div>
      <div class="form-actions"><button id="btn-submit" class="button primary" type="submit">Cadastrar tatuador</button><button id="btn-cancelar" class="button secondary" type="button" hidden>Cancelar</button></div>
    </form></section>
    <section class="panel"><div class="table-wrap"><table><thead><tr><th>ID</th><th>Nome</th><th>CPF</th><th>E-mail</th><th>Telefone</th><th>Senioridade</th><th>Estilos</th><th>Ações</th></tr></thead><tbody id="corpo-tabela"><tr><td colspan="8" class="empty-state">Carregando tatuadores...</td></tr></tbody></table></div></section>
  </main>
  <script src="js/auth.js"></script><script src="js/app.js"></script><script src="js/tatuadores.js"></script>
</body>
</html>
