<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clientes | Estúdio</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="nav-root"></div>
  <main class="page-shell">
    <div class="page-heading"><div><p class="eyebrow">Relacionamento</p><h1>Clientes</h1><p>Informações e histórico de quem passa pelo estúdio.</p></div></div>
    <div id="mensagem" class="alert notice" role="alert"></div>
    <section class="panel form-panel"><form id="form-cliente" class="form-grid">
      <div class="field wide"><label for="nome">Nome</label><input id="nome" maxlength="100" required></div>
      <div class="field"><label for="cpf">CPF</label><input id="cpf" inputmode="numeric" pattern="[0-9]{11}" maxlength="11" placeholder="11 números" required></div>
      <div class="field"><label for="telefone">Telefone</label><input id="telefone" maxlength="20" autocomplete="tel"></div>
      <div class="field"><label for="cidade">Cidade</label><input id="cidade" maxlength="100"></div>
      <div class="field"><label for="uf">UF</label><input id="uf" maxlength="2" pattern="[A-Za-z]{2}" placeholder="SP"></div>
      <div class="form-actions"><button id="btn-submit" class="button primary" type="submit">Cadastrar cliente</button><button id="btn-cancelar" class="button secondary" type="button" hidden>Cancelar</button></div>
    </form></section>
    <section class="panel"><div class="table-wrap"><table><thead><tr><th>ID</th><th>Nome</th><th>CPF</th><th>Telefone</th><th>Cidade</th><th>UF</th><th>Ações</th></tr></thead><tbody id="corpo-tabela"><tr><td colspan="7" class="empty-state">Carregando clientes...</td></tr></tbody></table></div></section>
  </main>
  <script src="js/auth.js"></script><script src="js/app.js"></script><script src="js/clientes.js"></script>
</body>
</html>
